# 键名与 en_US / 官方 Quicklinks 完全一致，只换文案。
plugin:
  quick_links:
    backend:
      info:
        name:
          other: 快捷链接
        description:
          other: 自定义侧边栏标签或链接，并提供符文卷轴操作按钮
      config:
        tags:
          title:
            other: 标签
          description:
            other: 侧边栏中的标签可快速访问
        links:
          title:
            other: 链接
          description:
            other: 用英文逗号分隔标题和链接，每行一个链接：“title, URL”
        menu_title:
          title:
            other: 操作菜单标题
          description:
            other: 额外按钮上方的小标题，默认「符文卷轴」。
        menu_items:
          title:
            other: 操作菜单项
          description:
            other: JSON 数组。action=plugin 会调用对应插件登记的动作（plugin 填目标 slug）；action=url 打开链接。
    frontend:
      quick_links: 快速链接
      rune_scroll: 符文卷轴
