<!-- 羊皮符文面板。rune.js 按类名填空：date/seal/cat/topic/name/meaning/guide/countdown。 -->
<div class="ans-rune-panel" data-ans-panel>
  <span class="ans-rune-corner ans-rune-corner--tl"></span>
  <span class="ans-rune-corner ans-rune-corner--tr"></span>
  <span class="ans-rune-corner ans-rune-corner--bl"></span>
  <span class="ans-rune-corner ans-rune-corner--br"></span>
  <div class="ans-rune-head">🔮 今日符文占卜</div>
  <div class="ans-rune-body">
    <div class="ans-rune-date"></div>
    <div class="ans-rune-seal"></div>
    <div style="text-align:center"><span class="ans-rune-cat"></span></div>
    <div class="ans-rune-topic"></div>
    <div class="ans-rune-name"></div>
    <p class="ans-rune-meaning"></p>
    <p class="ans-rune-guide"></p>
    <p class="ans-rune-note">每日限占一次 · 明日解锁新签</p>
    <p class="ans-rune-countdown"></p>
  </div>
</div>
